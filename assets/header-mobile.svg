<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380" role="img" aria-labelledby="title desc">
<title id="title">GrizzlyFX — Build tools. Make room to create.</title><desc id="desc">Original GrizzlyFX design in charcoal and gold.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1D1D1D"/><stop offset="1" stop-color="#0D0E10"/></linearGradient><linearGradient id="gold"><stop stop-color="#E6B450"/><stop offset="1" stop-color="#F9DA94"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E6B450" stroke-opacity=".045"/></pattern></defs>
<style>text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:monospace;letter-spacing:1.8px} .pulse{animation:pulse 4s ease-in-out infinite} @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}} @media(prefers-reduced-motion:reduce){.pulse{animation:none}}</style>
<rect width="600" height="380" rx="18" fill="url(#bg)"/><rect width="600" height="380" rx="18" fill="url(#grid)"/><rect x=".5" y=".5" width="599" height="379" rx="18" fill="none" stroke="#34312B"/><text x="36" y="45" fill="#E6B450" font-size="11" font-weight="600" class="mono">GFX / INDEPENDENT TOOLS &amp; CREATIVE SYSTEMS</text><path d="M36 65 H564" stroke="#34312B"/><text x="34" y="150" fill="#F4F1E9" font-size="64" font-weight="800" letter-spacing="-3">GRIZZLYFX</text><text x="38" y="192" fill="#E6B450" font-size="23" font-weight="400" >Build tools. Make room to create.</text><text x="38" y="235" fill="#B4B5B8" font-size="12" font-weight="400" class="mono">DESKTOP SOFTWARE  /  WORKFLOW AUTOMATION</text><text x="38" y="263" fill="#B4B5B8" font-size="12" font-weight="400" class="mono">CREATIVE CONTROL  /  PRACTICAL DESIGN</text><path d="M36 325 H564" stroke="#34312B"/><circle class="pulse" cx="43" cy="351" r="4" fill="#E6B450"/><text x="58" y="356" fill="#E6B450" font-size="12" font-weight="400" class="mono">SOLO19978</text><text x="360" y="356" fill="#B4B5B8" font-size="11" font-weight="400" class="mono">IDEA → BUILD → REFINE</text></svg>
