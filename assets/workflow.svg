<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="214" viewBox="0 0 1000 214" role="img" aria-labelledby="title desc">
<title id="title">Understand the workflow, build a clear tool, then test and refine it</title><desc id="desc">Original GrizzlyFX design in charcoal and gold.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1D1D1D"/><stop offset="1" stop-color="#0D0E10"/></linearGradient><linearGradient id="gold"><stop stop-color="#E6B450"/><stop offset="1" stop-color="#F9DA94"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E6B450" stroke-opacity=".045"/></pattern></defs>
<style>text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:monospace;letter-spacing:1.8px} .pulse{animation:pulse 4s ease-in-out infinite} @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}} @media(prefers-reduced-motion:reduce){.pulse{animation:none}}</style>
<rect width="1000" height="214" rx="18" fill="url(#bg)"/><rect width="1000" height="214" rx="18" fill="url(#grid)"/><rect x=".5" y=".5" width="999" height="213" rx="18" fill="none" stroke="#34312B"/><text x="32" y="38" fill="#F4F1E9" font-size="17" font-weight="700" class="mono">HOW I BUILD</text><rect x="32" y="65" width="296" height="119" rx="12" fill="#191B1F" stroke="#34312B"/><text x="49" y="92" fill="#E6B450" font-size="10" font-weight="400" class="mono">01 / UNDERSTAND</text><text x="49" y="126" fill="#F4F1E9" font-size="22" font-weight="700" >Find the friction</text><text x="49" y="157" fill="#B4B5B8" font-size="14" font-weight="400" >Start with the real workflow.</text><path d="M330 124 h17 m-5 -4 l5 4 -5 4" fill="none" stroke="#E6B450"/><rect x="351" y="65" width="296" height="119" rx="12" fill="#191B1F" stroke="#34312B"/><text x="368" y="92" fill="#E6B450" font-size="10" font-weight="400" class="mono">02 / MAKE</text><text x="368" y="126" fill="#F4F1E9" font-size="22" font-weight="700" >Build the tool</text><text x="368" y="157" fill="#B4B5B8" font-size="14" font-weight="400" >Keep the interface clear.</text><path d="M649 124 h17 m-5 -4 l5 4 -5 4" fill="none" stroke="#E6B450"/><rect x="670" y="65" width="296" height="119" rx="12" fill="#191B1F" stroke="#34312B"/><text x="687" y="92" fill="#E6B450" font-size="10" font-weight="400" class="mono">03 / REFINE</text><text x="687" y="126" fill="#F4F1E9" font-size="22" font-weight="700" >Test and improve</text><text x="687" y="157" fill="#B4B5B8" font-size="14" font-weight="400" >Make everyday use easier.</text></svg>
