<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-labelledby="title desc">
<title id="title">GFX LIVE MONITOR — Premiere Pro companion. A creative review tool exploring more flexible ways to preview work during the edit. Private source. Abstract illustration.</title><desc id="desc">Original GrizzlyFX design in charcoal and gold.</desc>
