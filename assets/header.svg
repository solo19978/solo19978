<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
<title id="title">GrizzlyFX — Build tools. Make room to create.</title><desc id="desc">Original GrizzlyFX design in charcoal and gold.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1D1D1D"/><stop offset="1" stop-color="#0D0E10"/></linearGradient><linearGradient id="gold"><stop stop-color="#E6B450"/><stop offset="1" stop-color="#F9DA94"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E6B450" stroke-opacity=".045"/></pattern></defs>
<style>text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:monospace;letter-spacing:1.8px} .pulse{animation:pulse 4s ease-in-out infinite} @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}} @media(prefers-reduced-motion:reduce){.pulse{animation:none}}</style>
<rect width="1000" height="360" rx="18" fill="url(#bg)"/><rect width="1000" height="360" rx="18" fill="url(#grid)"/><rect x=".5" y=".5" width="999" height="359" rx="18" fill="none" stroke="#34312B"/><text x="36" y="45" fill="#E6B450" font-size="12" font-weight="600" class="mono">GFX / INDEPENDENT TOOLS &amp; CREATIVE SYSTEMS</text><path d="M36 65 H964" stroke="#34312B"/><text x="34" y="153" fill="#F4F1E9" font-size="76" font-weight="800" letter-spacing="-3">GRIZZLYFX</text><text x="38" y="195" fill="#E6B450" font-size="25" font-weight="400" >Build tools. Make room to create.</text><text x="38" y="242" fill="#B4B5B8" font-size="13" font-weight="400" class="mono">DESKTOP SOFTWARE  /  WORKFLOW AUTOMATION</text><text x="38" y="268" fill="#B4B5B8" font-size="13" font-weight="400" class="mono">CREATIVE CONTROL  /  PRACTICAL DESIGN</text><path d="M36 305 H964" stroke="#34312B"/><circle class="pulse" cx="43" cy="331" r="4" fill="#E6B450"/><text x="58" y="336" fill="#E6B450" font-size="12" font-weight="400" class="mono">SOLO19978</text><text x="760" y="336" fill="#B4B5B8" font-size="11" font-weight="400" class="mono">IDEA → BUILD → REFINE</text><g transform="translate(808 175)"><circle r="105" fill="none" stroke="#E6B450" stroke-opacity="0.12" stroke-dasharray="315 20"/><circle r="80" fill="none" stroke="#E6B450" stroke-opacity="0.26" stroke-dasharray="240 20"/><circle r="54" fill="none" stroke="#E6B450" stroke-opacity="0.6" stroke-dasharray="162 20"/><path d="M-25 14 L0 -30 L25 14 L0 42 Z M-25 14 H25 M0 -30 V42" fill="none" stroke="#E6B450" stroke-width="2"/><circle class="pulse" cx="80" r="5" fill="#E6B450"/></g></svg>
