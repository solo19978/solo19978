name: Refresh public profile

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_profile.py
      - .github/workflows/refresh-profile.yml

permissions:
  contents: read

concurrency:
  group: public-profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build graphics from public GitHub data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/build_profile.py
      - name: Publish updated snapshot
        run: |
          git add assets/
          if git diff --cached --quiet; then
            echo "Public snapshot unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public project activity'
          git push
